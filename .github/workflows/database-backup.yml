name: Database backup

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

concurrency:
  group: production-database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production-backup
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
      BACKUP_PROJECT_ID: ${{ vars.BACKUP_PROJECT_ID }}
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump, compress, verify and upload
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          day_path="$(date -u +%Y/%m/%d)"
          project="${BACKUP_PROJECT_ID:-garmops}"
          dump="${RUNNER_TEMP}/${project}-${stamp}.dump.gz"
          pg_dump --no-owner --no-acl --format=custom "$DATABASE_URL" | gzip -9 > "$dump"
          test -s "$dump"
          sha256sum "$dump" > "${dump}.sha256"
          key="backups/supabase/${day_path}/${project}-${stamp}.dump.gz"
          aws s3 cp "$dump" "s3://${R2_BACKUP_BUCKET}/${key}" --endpoint-url "$R2_BACKUP_ENDPOINT" --no-progress
          aws s3 cp "${dump}.sha256" "s3://${R2_BACKUP_BUCKET}/${key}.sha256" --endpoint-url "$R2_BACKUP_ENDPOINT" --no-progress
          aws s3api head-object --bucket "$R2_BACKUP_BUCKET" --key "$key" --endpoint-url "$R2_BACKUP_ENDPOINT" >/dev/null
      - name: Remove runner copy
        if: always()
        run: find "$RUNNER_TEMP" -maxdepth 1 -type f -name '*.dump.gz*' -delete
